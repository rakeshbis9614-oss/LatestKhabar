    <script>
        (function() {
            var t = localStorage.getItem('theme') || 'light';
            document.documentElement.classList.remove('light', 'dark');
            document.documentElement.classList.add(t);
        })();
    </script>

                <a href="/" class="header-logo" aria-label="Latest Khabar Home">
                    <img src="./Latest Khabar Logo.webp" alt="Latest Khabar Logo" class="logo-img" height="48" fetchpriority="high" loading="eager">
                </a>
            </div>
            <div class="header-actions">
                <a href="/" class="icon-btn" aria-label="होम">
                    <svg class="icon" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>

                        <div class="skeleton-loader" style="height:24px;width:80%;margin-bottom:24px;border-radius:6px"></div>
                        <div class="skeleton-loader" style="height:400px;width:100%;margin-bottom:24px;border-radius:12px"></div>
                        <div class="skeleton-loader" style="height:16px;width:100%;margin-bottom:12px;border-radius:4px"></div>
                        <div class="skeleton-loader" style="height:16px;width:90%;margin-bottom:12px;border-radius:4px"></div>
                        <div class="skeleton-loader" style="height:16px;width:95%;border-radius:4px"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav" role="navigation" aria-label="मोबाइल नेविगेशन">
        <div class="bottom-nav-container">
            <a href="/" class="bottom-nav-item" title="होम">

                <span class="nav-label">ट्रेंडिंग</span>
            </button>
            <button class="bottom-nav-item" title="बुकमार्क">

            <button class="bottom-nav-item" title="मेनू">

            </div>

                    <li><a href="./terms-and-conditions.html" class="footer-link">शर्तें और शरतें</a></li>

                <p class="footer-copyright">2026 Latest Khabar. All Rights Reserved.</p>
            </div>

    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', function() {
                var isDark = document.documentElement.classList.toggle('dark');
                document.documentElement.classList.toggle('light', !isDark);
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });
        }
        var header = document.getElementById('main-header');
        window.addEventListener('scroll', function() {
            header.classList.toggle('scrolled', window.scrollY > 10);
        }, { passive: true });
    </script>
    <script type="module" src="/firebase-config.js"></script>
    <script type="module" src="/app.js"></script>
</body>
